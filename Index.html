<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Bienvenido a mi página</h1>
    </header>

    <main>
        <p>Este es un ejemplo básico usando HTML y CSS separados.</p>
        <button id="botonSaludo">Haz clic aquí</button>
    </main>

    <footer>
        <p>© 2026 - Mi Proyecto</p>
    </footer>

    <script>
        document.getElementById("botonSaludo").addEventListener("click", function() {
            alert("¡Hola! 👋 Gracias por hacer clic.");
        });
    </script>

</body>
</html>
